name: Atualizar projetos do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "31 7 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar seção dos projetos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_projects.py
      - name: Publicar se houver mudança
        run: |
          if git diff --quiet -- README.md; then
            echo "Nenhuma atualização."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: atualiza atividade dos projetos"
          git push
